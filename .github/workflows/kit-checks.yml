name: Kit and repository safety
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: kit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node for kit checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned Gitleaks source release
        env:
          GOTOOLCHAIN: auto
        run: |
          go version
          go install -ldflags="-X github.com/zricethezav/gitleaks/v8/version.Version=8.30.1" github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install local repository hooks
        run: npm run hooks:install
      - name: Verify kit, guard, real scanner and Git metadata
        run: npm run preflight
# This validates the kit and repository safety.
# Real application and browser checks live in app-checks.yml.
# No deployments, registry pushes, secrets or pull_request_target execution.
